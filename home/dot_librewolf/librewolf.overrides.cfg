// Enable google safebrowsing
defaultPref("browser.safebrowsing.malware.enabled", true);
defaultPref("browser.safebrowsing.phishing.enabled", true);
defaultPref("browser.safebrowsing.blockedURIs.enabled", true);
defaultPref(
  "browser.safebrowsing.provider.google4.gethashURL",
  "https://safebrowsing.googleapis.com/v4/fullHashes:find?$ct=application/x-protobuf&key=%GOOGLE_SAFEBROWSING_API_KEY%&$httpMethod=POST"
);
defaultPref(
  "browser.safebrowsing.provider.google4.updateURL",
  "https://safebrowsing.googleapis.com/v4/threatListUpdates:fetch?$ct=application/x-protobuf&key=%GOOGLE_SAFEBROWSING_API_KEY%&$httpMethod=POST"
);
defaultPref(
  "browser.safebrowsing.provider.google.gethashURL",
  "https://safebrowsing.google.com/safebrowsing/gethash?client=SAFEBROWSING_ID&appver=%MAJOR_VERSION%&pver=2.2"
);
defaultPref(
  "browser.safebrowsing.provider.google.updateURL",
  "https://safebrowsing.google.com/safebrowsing/downloads?client=SAFEBROWSING_ID&appver=%MAJOR_VERSION%&pver=2.2&key=%GOOGLE_SAFEBROWSING_API_KEY%"
);

// Use Fingerprinting Protection instead of complete disable for automatic dark mode detection
defaultPref("privacy.fingerprintingProtection", true);
defaultPref(
  "privacy.fingerprintingProtection.overrides",
  "+AllTargets,-CSSPrefersColorScheme"
);

// Restore previous windows and tabs on startup
defaultPref("browser.startup.page", 3);

// Preserve history so session restore can work
defaultPref("privacy.clearOnShutdown.history", false);
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);

// Open new windows with google
pref("browser.startup.homepage", "https://www.google.com");

// Disable nova redesign
defaultPref("browser.nova.enabled", false);
defaultPref("browser.newtabpage.activity-stream.nova.enabled", false);

// Enable vertical tabs and the sidebar
pref("sidebar.verticalTabs", true);

// Move the sidebar to the right
pref("sidebar.position_start", false);

// Hide tabs and sidebar (collapsed until hovered)
pref("sidebar.visibility", "hide-sidebar");
