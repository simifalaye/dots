# Source: https://alacritty.org/config-alacritty.html

[general]
live_config_reload = true
working_directory = "None" # Inherit from parent
import = [
  "themes/tokyonight_night.toml",
  # "themes/techbase.toml",
  # TODO: Load local theme
  # "theme.toml",
  # Load local config
  "alacritty-local.toml",
]

[window]
padding = { x = 0, y = 0 }
dynamic_padding = true
option_as_alt = "Both"
opacity = 1.0
blur = false

[cursor]
# Simple beam for the lowest latency visual feedback
style = { shape = "Beam", blinking = "On" }
blink_interval = 400
thickness = 0.15

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 14

[terminal]
shell = { program = "wsl" }

[keyboard]
bindings = [
  {key = "Space", mods = "Control", chars = "\u0000"},
  {key = "Key6", mods = "Control", chars = "\u001e"},
]

[env]
TERM = "xterm-256color"

[debug]
# render_timer = false
# persistent_logging = false
# log_level = "Debug"
# renderer = "None"
# print_events = true
# highlight_damage = false
# prefer_egl = false
